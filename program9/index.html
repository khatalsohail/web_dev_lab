<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Nav and CSS Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: black;
      color: white;
      padding: 20px;
      flex-wrap: wrap;
    }

    .navbar .logo {
      font-weight: bold;
    }

    .navbar .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .navbar a {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 900px;
      margin: 2px auto;
      padding: 15px;
    }

    h1 {
      margin-bottom: 1.5rem;
      color: black;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;;
    }

    .box {
      background-color: skyblue;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border-radius: 8px;
    }
   </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">sohail</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

    <div class="container">
    <h1>Responsive Nav and CSS Grid</h1>

    <div class="grid-container">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
    </div>
  </div>

</body>
</html>
